name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secrets are used anywhere in this workflow: everything below runs offline against the
# simulated payment rail and mocked services. Least privilege for the token:
permissions:
  contents: read

jobs:
  go:
    name: Go (vet, format, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...

  rust:
    name: Rust signer (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/near
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: adapters/near
      # The network test is #[ignore]d, so this stays offline.
      - run: cargo test

  web:
    name: Website (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Next.js bakes the API proxy rewrites in at build time; a local URL is enough to build.
      - run: npm run build
        env:
          GO_API_URL: http://localhost:8080
